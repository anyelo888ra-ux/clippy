<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy AI - Verificación</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- hCaptcha -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: radial-gradient(circle at top, #1a1d2e 0%, #0a0b0f 60%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .captcha-container {
            max-width: 420px;
            width: 100%;
            padding: 40px 32px;
            background: #16181f;
            border: 1px solid #23252f;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .captcha-logo {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .captcha-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .captcha-subtitle {
            color: #a78bfa;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        
        .h-captcha {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .status {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 16px;
        }
        
        .status.pending {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        .status.success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    
    <div class="captcha-container">
        <div class="captcha-logo">📎</div>
        <div class="captcha-title">Verificación</div>
        <div class="captcha-subtitle">Confirma que eres humano para continuar</div>
        
        <!-- hCaptcha -->
        <div class="h-captcha" 
             data-sitekey="8b70f298-ae2e-4ae2-88d6-6cd20e56111c"
             data-theme="dark"
             data-callback="onCaptchaSuccess"
             data-expired-callback="onCaptchaExpired">
        </div>
        
        <div id="status" class="status pending">
            ⏳ Esperando verificación...
        </div>
        
        <div class="footer">
            Protegido por hCaptcha
        </div>
    </div>
    
    <script>
        function onCaptchaSuccess(token) {
            console.log('✅ hCaptcha verificado');
            
            const status = document.getElementById('status');
            status.className = 'status success';
            status.textContent = '✅ Verificación exitosa. Redirigiendo...';
            
            // Redirigir a chat.html
            setTimeout(() => {
                window.location.href = '/clippy/chat.html';
            }, 1000);
        }
        
        function onCaptchaExpired() {
            const status = document.getElementById('status');
            status.className = 'status pending';
            status.textContent = '⏳ Captcha expirado. Verifica de nuevo.';
        }
    </script>
    
</body>
</html>
